name: Build Mini Termux APT repository

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install packaging tools
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install ruamel.yaml termux-apt-repo
          curl -L https://github.com/termux/termux-create-package/releases/download/v0.12.0/termux-create-package -o /usr/local/bin/termux-create-package
          chmod 755 /usr/local/bin/termux-create-package
          sed -i '/^import importlib$/a import importlib.util' /usr/local/bin/termux-create-package

      - name: Build Termux deb
        run: |
          rm -rf pkgroot deb
          mkdir -p deb pkgroot/DEBIAN
          mkdir -p pkgroot/data/data/com.termux/files/usr/bin
          cat > pkgroot/DEBIAN/control <<'EOF'
          Package: mini
          Version: 1.0.0
          Architecture: all
          Maintainer: Ashikul Islam <ashikulislam2726@gmail.com>
          Depends: python
          Homepage: https://github.com/ashikulislam2726-rgb/Mini
          Description: Mini - a lightweight Termux AI coding assistant
           Uses OpenRouter with Gemma 4 26B A4B as the primary model.
           The API key is requested at runtime and is never stored by the package.
          EOF
          install -m 755 mini.py pkgroot/data/data/com.termux/files/usr/bin/mini
          dpkg-deb --build pkgroot deb/mini_1.0.0_all.deb
          ls -lah deb

      - name: Build APT repository
        run: |
          rm -rf site
          termux-apt-repo deb site termux main
          touch site/.nojekyll
          printf '%s\n' 'Mini Termux APT repository' > site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
